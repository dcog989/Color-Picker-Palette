<svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Color Picker Palette</title>
  <defs>
    <!-- Correct path for exactly 30-degree segment with proper calculations -->
    <path id="segment" d="M256,256 L512,256 A256,256 0 0,1 477.5825,384 Z" />
  </defs>

  <!-- 12 segments covering exactly 30 degrees each -->
  <g transform="rotate(0,256,256)">
    <use href="#segment" fill="#d52a2a" />
  </g>
  <g transform="rotate(30,256,256)">
    <use href="#segment" fill="#d5802a" />
  </g>
  <g transform="rotate(60,256,256)">
    <use href="#segment" fill="#d5d52a" />
  </g>
  <g transform="rotate(90,256,256)">
    <use href="#segment" fill="#80d52a" />
  </g>
  <g transform="rotate(120,256,256)">
    <use href="#segment" fill="#2ad52a" />
  </g>
  <g transform="rotate(150,256,256)">
    <use href="#segment" fill="#2ad580" />
  </g>
  <g transform="rotate(180,256,256)">
    <use href="#segment" fill="#2ad5d5" />
  </g>
  <g transform="rotate(210,256,256)">
    <use href="#segment" fill="#2a7fd5" />
  </g>
  <g transform="rotate(240,256,256)">
    <use href="#segment" fill="#2a2ad5" />
  </g>
  <g transform="rotate(270,256,256)">
    <use href="#segment" fill="#7f2ad5" />
  </g>
  <g transform="rotate(300,256,256)">
    <use href="#segment" fill="#d52ad5" />
  </g>
  <g transform="rotate(330,256,256)">
    <use href="#segment" fill="#d52a80" />
  </g>
</svg>
